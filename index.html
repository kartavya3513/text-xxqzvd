<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chair Configurator</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,sans-serif;color:#111;background:#f3f3f0}#app{height:100%;display:grid;grid-template-columns:1fr 380px}#view{position:relative}canvas{width:100%;height:100%;display:block}.top{position:absolute;top:20px;left:22px;right:22px;display:flex;justify-content:space-between;z-index:2;font-size:11px;font-weight:700;letter-spacing:.12em}.tools{display:flex;gap:6px}.btn{border:1px solid #ddd;background:#fff;border-radius:20px;padding:9px 12px;font-size:10px;cursor:pointer}.btn.on{background:#111;color:#fff}.panel{background:#fff;border-left:1px solid #ddd;padding:26px;overflow:auto}.eyebrow{font-size:10px;color:#777;letter-spacing:.14em;font-weight:700}.title{font-size:29px;letter-spacing:-.04em;margin:7px 0}.sub{font-size:12px;color:#777;line-height:1.5;margin-bottom:20px}.sec{border-top:1px solid #e5e5df;padding:18px 0}.sec:first-of-type{border-top:0;padding-top:0}.head{display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-bottom:10px}.tag{font-size:9px;color:#777;border:1px solid #ddd;border-radius:20px;padding:5px 8px}.drop{display:block;border:1px dashed #bbb;border-radius:12px;padding:18px;text-align:center;background:#fafaf8;cursor:pointer}.drop b{font-size:12px}.drop span{display:block;font-size:10px;color:#888;margin-top:5px}.status{margin-top:8px;padding:10px;border-radius:9px;background:#f4f4f1;color:#777;font-size:10px;line-height:1.45}.colors{display:grid;grid-template-columns:1fr 1fr;gap:8px}.color{border:1px solid #ddd;border-radius:12px;background:#fff;padding:10px;text-align:left;cursor:pointer}.color.active{border-color:#111;box-shadow:inset 0 0 0 1px #111}.swatch{width:40px;height:40px;border-radius:50%;margin-bottom:8px;border:1px solid #ccc}.gray{background:linear-gradient(145deg,#eee,#888)}.red{background:linear-gradient(145deg,#f05a5a,#8e1111)}.color b{font-size:11px}.color small{display:block;color:#888;font-size:9px;margin-top:4px}.mats{display:grid;gap:6px}.mat{border:1px solid #ddd;background:#fff;border-radius:9px;padding:9px;text-align:left;cursor:pointer}.mat.active{border-color:#111}.mat b{font-size:10px}.mat small{display:block;color:#888;font-size:9px;margin-top:3px}@media(max-width:850px){#app{display:block;overflow:auto}#view{height:60vh;min-height:450px}.panel{border-left:0;border-top:1px solid #ddd}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head><body><div id="app"><main id="view"><div class="top"><span>3D / PRODUCT CONFIGURATOR</span><div class="tools"><button class="btn" id="auto">Auto rotate</button><button class="btn" id="front">Front</button><button class="btn" id="reset">Reset</button></div></div><canvas id="c"></canvas></main><aside class="panel"><div class="eyebrow">AERON-STYLE INTERACTION</div><div class="title">Chair Configurator</div><div class="sub">Upload your GLB and switch the seat + back between Gray and Red.</div><section class="sec"><div class="head"><span>MODEL</span><span class="tag" id="tag">Waiting</span></div><label class="drop"><input id="file" type="file" accept=".glb" hidden><b>Upload GLB</b><span>Drag your chair GLB here or click</span></label><div class="status" id="status">Upload the supplied chair GLB to begin.</div></section><section class="sec"><div class="head"><span>SEAT + BACK FINISH</span><span class="tag" id="label">Gray</span></div><div class="colors"><button class="color active" data-c="gray"><div class="swatch gray"></div><b>Gray</b><small>Original material</small></button><button class="color" data-c="red"><div class="swatch red"></div><b>Red</b><small>Live texture tint</small></button></div></section><section class="sec"><div class="head"><span>MATERIALS</span><span class="tag" id="count">0</span></div><div class="mats" id="mats"></div></section></aside></div><script type="module">import*as T from'three';import{OrbitControls as O}from'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';import{GLTFLoader as L}from'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';const $=x=>document.getElementById(x),r=new T.WebGLRenderer({canvas:$('c'),antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;const s=new T.Scene();s.background=new T.Color(0xf3f3f0);const cam=new T.PerspectiveCamera(28,1,.01,100),ctl=new O(cam,r.domElement);ctl.enableDamping=true;ctl.minDistance=.6;ctl.maxDistance=7;ctl.target.set(0,.8,0);s.add(new T.HemisphereLight(0xffffff,0x888888,2.3));let l=new T.DirectionalLight(0xffffff,3);l.position.set(4,6,4);s.add(l);let model,rs=[],orig=new Map(),loader=new L();function resize(){let w=r.domElement.clientWidth||1,h=r.domElement.clientHeight||1;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();function fit(){if(!model)return;let b=new T.Box3().setFromObject(model),z=b.getSize(new T.Vector3()),c=b.getCenter(new T.Vector3());model.position.sub(c);model.scale.setScalar(2.4/(Math.max(z.x,z.y,z.z)||1));b.setFromObject(model);model.position.y+=-b.min.y+.02;let cc=b.getCenter(new T.Vector3());ctl.target.set(0,cc.y*.9,0);cam.position.set(2.7,1.5,3.2);ctl.update()}function mats(){rs=[];orig.clear();model.traverse(o=>{if(!o.isMesh)return;let a=Array.isArray(o.material)?o.material:[o.material];a.forEach(m=>{if(m&&!rs.some(x=>x.m===m)){let q={m,n:m.name||o.name||'Material'};rs.push(q);orig.set(m,m.clone())}})});$('count').textContent=rs.length;$('mats').innerHTML=rs.map((x,i)=>'<button class="mat" data-i="'+i+'"><b>'+x.n+'</b><small>'+x.m.type+'</small></button>').join('');document.querySelectorAll('.mat').forEach((b,i)=>b.onclick=()=>{document.querySelectorAll('.mat').forEach(x=>x.classList.remove('active'));b.classList.add('active')})}function finish(c){rs.forEach(x=>{let m=x.m;m.copy(orig.get(m));let n=x.n.toLowerCase();if(c==='red'&&(n.includes('seat')||n.includes('back rest')||n.includes('backrest')))m.color.set(0xc62f2f);m.needsUpdate=true});$('label').textContent=c==='red'?'Red':'Gray';document.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('active',x.dataset.c===c));$('status').textContent=c==='red'?'Red finish applied.':'Gray finish restored.'}function load(f){$('tag').textContent='Loading';$('status').textContent='Loading '+f.name+'…';let q=new FileReader;q.onload=e=>loader.parse(e.target.result,'',g=>{if(model)s.remove(model);model=g.scene;s.add(model);mats();fit();finish('gray');$('tag').textContent='Loaded';$('status').textContent='Model loaded. Drag to rotate / scroll to zoom.'},e=>{$('tag').textContent='Error';$('status').textContent='GLB error: '+(e?.message||e)});q.readAsArrayBuffer(f)}$('file').onchange=e=>e.target.files[0]&&load(e.target.files[0]);document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>finish(b.dataset.c));$('auto').onclick=e=>{ctl.autoRotate=!ctl.autoRotate;e.currentTarget.classList.toggle('on',ctl.autoRotate)};$('front').onclick=()=>{cam.position.set(0,cam.position.y,cam.position.z);ctl.update()};$('reset').onclick=fit;(function a(){requestAnimationFrame(a);ctl.update();r.render(s,cam)})()</script></body></html>
